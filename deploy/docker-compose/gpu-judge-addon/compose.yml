# 基础层：nginx 前端（TLS 终结 + least_conn 负载均衡）。judge 实例由 render-topology.sh
# 按 runtime.env（JUDGE_GPU_IDS × JUDGE_INSTANCES_PER_GPU）生成到 compose.instances.yml，
# 始终以 `-f compose.yml -f compose.instances.yml` 一起使用。
services:
  judge-lb:
    image: jjdguard/judge-lb-nginx:2.1.0
    restart: unless-stopped
    ports:
      - "${JUDGE_BIND_IP:-127.0.0.1}:${JUDGE_HOST_PORT:-8094}:8443"
    networks:
      - judge-backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/tls:ro
    read_only: true
    # 组 10001 与 install.sh 给 tls/server.key 设置的属组一致（0640）。
    user: "101:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=101,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "nginx", "-t", "-q", "-c", "/etc/nginx/nginx.conf"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  # 实例只在这个网络上监听，不映射宿主端口；对外只暴露 nginx 的 HTTPS 端口。
  judge-backend: {}
