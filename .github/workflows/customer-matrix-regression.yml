name: Customer Matrix Regression

on:
  pull_request:
  push:
    branches:
      - main
      - gitee/main

jobs:
  customer-matrix-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security-engine dependencies
        run: python -m pip install -r apps/security-engine/requirements.txt pytest

      - name: Run customer matrix regression
        run: ./scripts/customer_matrix_regression.sh
