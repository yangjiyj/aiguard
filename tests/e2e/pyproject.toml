[project]
name = "jjdguard-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.40",
    "pytest-html>=4.0",
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 30
testpaths = ["smoke", "scenarios"]
markers = [
    "smoke: 快速冒烟（< 5 分钟）",
    "scenario: 业务流程场景",
    "destructive: 涉及容器重启等危险操作（默认跳过）",
]
