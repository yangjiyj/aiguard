[project]
name = "security-engine"
version = "1.0.0"
description = "JJDGuard Security Engine - Regex-based detection"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "regex>=2024.11.6,<2027.0.0",
    "pypdf==6.17.0",
    "Pillow==12.1.1",
    "tesserocr==2.11.0",
    "cysignals==1.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
