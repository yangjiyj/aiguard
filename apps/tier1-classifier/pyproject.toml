[project]
name = "tier1-classifier"
version = "1.0.0"
description = "Tier-1 prompt-attack classifier sidecar (JJDGuard-trained multilingual-e5-small + LR head, fused ONNX, CPU)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "onnxruntime>=1.18.0",
    "transformers>=4.44.0",
    "numpy>=1.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
