worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # D7 旧书签重定向判定：方法是 GET/HEAD 且 Accept 含 text/html 才算「浏览器导航」。
    map "$request_method:$http_accept" $mcp_legacy_console_nav {
        default 0;
        "~^(GET|HEAD):.*[Tt][Ee][Xx][Tt]/[Hh][Tt][Mm][Ll]" 1;
    }
    # overview 已下线，回到调用审计，且不带 query；其余页面同名，保留 query。
    map $uri $mcp_legacy_console_page {
        default "";
        "~^/mcp/(servers|policies|approvals|audit)$" $1;
        "/mcp/overview" audit;
    }
    map $uri $mcp_legacy_console_args {
        default $is_args$args;
        "/mcp/overview" "";
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API proxy - control plane
        location /admin/ {
            proxy_pass http://control-plane:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API proxy - gateway
        location /v1/ {
            proxy_pass http://gateway-core:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # 控制台页面已迁到 /mcp-gateway/*。旧书签 /mcp/servers 等：仅对浏览器导航（GET/HEAD 且 Accept 含 text/html）
        # 302 到新路径并保留 query，与 server.js 的 legacyMcpConsoleRedirect 完全一致；
        # 其他方法（POST/PUT/DELETE…）与 MCP 客户端（不发 text/html）继续落到数据面代理，不受影响。
        # overview 是已下线页面的旧书签，统一回到调用审计（不带 query）。
        # nginx 不允许嵌套 if，判定用 http 级 map 完成（见文件顶部 http 块里的 $mcp_legacy_*）。
        location ~ ^/mcp/(servers|policies|approvals|audit|overview)$ {
            if ($mcp_legacy_console_nav = "1") {
                return 302 /mcp-gateway/$mcp_legacy_console_page$mcp_legacy_console_args;
            }
            proxy_pass http://gateway-core:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # MCP public endpoint - keep Streamable HTTP/SSE unbuffered and expose
        # the same /mcp/{serverID} route as gateway-core.
        location /mcp/ {
            proxy_pass http://gateway-core:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
